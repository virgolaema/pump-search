name: collect  # scheduled collector
on:
  schedule:
    - cron: "*/10 8-23 * * 1-5"    # UTC; US pre-market (04:00 ET) through post-market
  workflow_dispatch:
  push:                           # test run whenever the code changes
    branches: [main]
    paths: ["pump/**", "requirements.txt", ".github/workflows/**"]
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        shell: bash
        run: |
          mkdir -p logs
          python -m pump.collect 2>&1 | tee logs/collect.log
          exit ${PIPESTATUS[0]}
      - name: commit data
        if: always()
        run: |
          git config user.name "pump-bot"
          git config user.email "pump-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: collect $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
