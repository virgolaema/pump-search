name: collect
on:
  schedule:
    - cron: "*/30 11-21 * * 1-5"   # UTC; covers US pre-market through close in both EDT and EST
  workflow_dispatch:
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pump.collect
      - name: commit data
        run: |
          git config user.name "pump-bot"
          git config user.email "pump-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: collect $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
