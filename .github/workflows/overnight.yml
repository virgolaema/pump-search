name: overnight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["overnight/study.py", ".github/workflows/overnight.yml"]
concurrency:
  group: overnight
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        shell: bash
        run: |
          python -m overnight.study 2>&1 | tee overnight/log.txt
          exit ${PIPESTATUS[0]}
      - name: commit
        if: always()
        run: |
          git config user.name "pump-bot"
          git config user.email "pump-bot@users.noreply.github.com"
          git add overnight
          git diff --cached --quiet && exit 0
          git commit -qm "overnight study results $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
